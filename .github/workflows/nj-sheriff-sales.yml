name: Refresh NJ sheriff sales

# Every day: read the 17 NJ county sheriffs' official foreclosure listings,
# save them to www/data/nj_sheriff_sales.json, and republish the website.
on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC = early morning in New Jersey
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nj-sheriff-sales
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect listings
        run: python scripts/nj_sheriff_sales.py www/data/nj_sheriff_sales.json
      - name: Save if changed
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/nj_sheriff_sales.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh NJ sheriff sales"
            # Someone may have pushed while this ran; put the refresh on top and retry.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 10
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Republish website
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main
